name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接装 cmdline-tools，不依赖第三方 SDK action（本机实测该链路可用）
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${RUNNER_TEMP:-/home/runner}/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 关键：**不注入任何真实密钥**。
      # buildConfigField 里的字符串会明文落在 DEX 中，v0.1.0~v0.1.17 就是这么
      # 把真实 API Key 泄露到公开 Release 的。这里只写占位符，
      # 由 BuildConfigKeys.isPlaceholder() 在运行时识别成「未配置」，
      # 用户首次启动后自己在设置页填。
      #
      # LLM_BASE_URL / LLM_MODEL 不是机密，保留为变量以减少用户配置量。
      - name: Generate local.properties (no secrets)
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}"
            echo "LLM_MODEL=${LLM_MODEL:-deepseek-chat}"
          } > local.properties
          cat local.properties

      # 发布密钥：从 Secrets 还原出 keystore.properties。
      #
      # ## 为什么必须固定密钥
      # 之前 CI 出的是 assembleDebug，用 runner 上自动生成的 debug keystore。
      # GitHub runner 是一次性 VM，keystore 用完即弃，**每次构建签名都不同**。
      # Android 会拒绝安装签名不一致的更新，于是每个版本都只能卸载重装，
      # 手机里的数据一起没——不是「装不上」，是**永远装不上更新**。
      #
      # keystore 只以 base64 存进 Secrets，仓库里永远只有这段还原逻辑。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::未配置 RELEASE_KEYSTORE_B64，无法产出可升级的安装包。"
            echo "::error::不签名也能构建，但那样每个版本都要卸载重装（数据会丢）。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # 还原后立刻自检：密钥损坏时要在构建前就发现，而不是产出一个装不上的包
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$STORE_PASSWORD" > /dev/null
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties 已生成（口令不回显）"

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          # release 构建类型本身就不注入任何 Key（BuildConfig 里是空串），
          # 所以这里不需要 -PprefillKeys——它只影响 debug。
          ./gradlew --no-daemon assembleRelease

      # 闸门 1：产物必须真的签上名。
      # 没签名的包也能装，但下一次就装不上更新了——这种问题在发版当天发现不了，
      # 要等用户反馈「更新装不上」才发现，所以在这里拦住。
      #
      # **必须带 --verbose**：`apksigner verify` 不加它时，校验通过也**不输出**
      # "Verifies" 这行，只在失败时才输出错误。第一版闸门就是漏了这个参数，
      # 结果包是签好名的却被自己的闸门拦下，白跑一轮 CI。
      #
      # 判据有两层：`apksigner verify` 校验失败时退出码非 0（set -e 直接拦），
      # 再正向确认确实报出了签名者。
      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sig.txt
          grep -qE "Number of signers: [1-9]" /tmp/sig.txt || {
            echo "::error::APK 未报出签名者，拒绝上传"
            exit 1
          }
          echo "签名校验通过"
          grep -E "certificate SHA-256" /tmp/sig.txt || true

      # 闸门 2：签名要和仓库记录的那份一致。
      #
      # ## 为什么 CI 也要查
      # 「包能装上」和「下次能升级」是两件事。密钥一旦被误换，
      # 这一轮的包照样装得上、跑得动，问题要到用户点更新时才会暴露。
      # 在这里拦住，比发出去之后再撤回便宜得多。
      #
      # fork 用户的密钥当然和本仓库记录的不一致，所以只在
      # 维护者的 main 分支上强制；其它情况降级为提示。
      - name: Verify signer matches recorded fingerprint
        run: |
          set -euo pipefail
          EXPECTED=$(grep -vE '^\s*#' signing/expected-cert-sha256.txt | grep -vE '^\s*$' | head -1 | tr -d '[:space:]' | tr 'a-f' 'A-F')
          ACTUAL=$(grep -E "certificate SHA-256 digest" /tmp/sig.txt | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F')
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ]; then
            echo "::warning::读不到期望或实际指纹，跳过一致性比对"
            exit 0
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            if [ "${GITHUB_REPOSITORY}" = "ausyeah/android-mistakebook" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::签名证书与 signing/expected-cert-sha256.txt 不一致"
              echo "::error::已安装的用户将无法升级这个 App。请勿发布，先核对发布密钥。"
              exit 1
            fi
            echo "::warning::签名与仓库记录不一致（非维护者仓库，跳过）"
            echo "  期望: $EXPECTED"
            echo "  实际: $ACTUAL"
            exit 0
          fi
          echo "签名证书与仓库记录一致: $ACTUAL"

      # 闸门 2：产物里绝不能出现 API Key。密钥一旦进过 Release 就等于公开，
      # 必须在上传前拦住，而不是靠人肉检查。
      - name: Verify no secrets in APK
        run: |
          set -euo pipefail
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -qq app/build/outputs/apk/release/app-release.apk -d /tmp/apkcheck
          # 真实 Key 不在仓库里，改为检测「任何 sk- 开头的长串」
          if grep -rEoh 'sk-[A-Za-z0-9]{20,}' /tmp/apkcheck/*.dex 2>/dev/null | head -n 5; then
            echo "::error::APK 中检测到疑似 API Key，拒绝上传"
            exit 1
          fi
          echo "APK 内未检测到 API Key"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare APK
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          SAFE_REF=$(echo "$REF" | tr '/' '-')
          mkdir -p dist
          # 命名规范：mistakebook-<version>-android.apk
          # 不再用 `-debug` 后缀——公开分发的就是唯一产物，
          # 「debug」这个名字会让用户以为是测试版而不敢用。
          cp app/build/outputs/apk/release/app-release.apk "dist/mistakebook-${SAFE_REF}-android.apk"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistakebook-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装与首次配置

            1. 下载 `mistakebook-${{ github.ref_name }}-android.apk` 安装（需允许「安装未知来源应用」）
            2. 首次启动后进入 **设置**，填写两个密钥：
               - **MinerU API Key** —— 在 MinerU 开放平台申请
               - **大模型接入** —— 填接口地址与 API Key，点「获取模型列表」可自动选模型名

            > **本安装包不预置任何 API Key。**
            > 早期版本曾把密钥打进安装包，而 APK 里的密钥是可以被直接提取的。
            > 现已改为由使用者自行填写；如果你在旧版本里填过密钥，
            > 建议到服务商后台把它们重置一次。


