name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接装 cmdline-tools，不依赖第三方 SDK action（本机实测该链路可用）
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${RUNNER_TEMP:-/home/runner}/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 关键：**不注入任何真实密钥**。
      # buildConfigField 里的字符串会明文落在 DEX 中，v0.1.0~v0.1.17 就是这么
      # 把真实 API Key 泄露到公开 Release 的。这里只写占位符，
      # 由 BuildConfigKeys.isPlaceholder() 在运行时识别成「未配置」，
      # 用户首次启动后自己在设置页填。
      #
      # LLM_BASE_URL / LLM_MODEL 不是机密，保留为变量以减少用户配置量。
      - name: Generate local.properties (no secrets)
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}"
            echo "LLM_MODEL=${LLM_MODEL:-deepseek-chat}"
          } > local.properties
          cat local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # -PprefillKeys=false：注入占位符而非真实 Key
          ./gradlew --no-daemon assembleDebug -PprefillKeys=false

      # 闸门：产物里绝不能出现真实 Key。密钥一旦进过 Release 就等于公开，
      # 必须在上传前拦住，而不是靠人肉检查。
      - name: Verify no secrets in APK
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null; then
            echo "unzip 不可用，跳过（CI 镜像自带，此处仅作保险）"
            exit 0
          fi
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          unzip -qq app/build/outputs/apk/debug/app-debug.apk -d /tmp/apkcheck
          # 真实 Key 不在仓库里，改为检测「任何 sk- 开头的长串」
          if grep -rEoh 'sk-[A-Za-z0-9]{20,}' /tmp/apkcheck/*.dex 2>/dev/null | head -n 5; then
            echo "::error::APK 中检测到疑似 API Key，拒绝上传"
            exit 1
          fi
          echo "APK 内未检测到 API Key"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare APK
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          SAFE_REF=$(echo "$REF" | tr '/' '-')
          mkdir -p dist
          # 命名规范：mistakebook-<version>-android.apk
          # 不再用 `-debug` 后缀——公开分发的就是唯一产物，
          # 「debug」这个名字会让用户以为是测试版而不敢用。
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mistakebook-${SAFE_REF}-android.apk"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistakebook-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装与首次配置

            1. 下载 `mistakebook-${{ github.ref_name }}-android.apk` 安装（需允许「安装未知来源应用」）
            2. 首次启动后进入 **设置**，填写两个密钥：
               - **MinerU API Key** —— 在 MinerU 开放平台申请
               - **大模型接入** —— 填接口地址与 API Key，点「获取模型列表」可自动选模型名

            > **本安装包不预置任何 API Key。**
            > 早期版本曾把密钥打进安装包，而 APK 里的密钥是可以被直接提取的。
            > 现已改为由使用者自行填写；如果你在旧版本里填过密钥，
            > 建议到服务商后台把它们重置一次。


